name: framepack
version: "0.11.1"
description: >-
  Prompt Factory for HyperFrames. Translates fuzzy user intent into frame.md
  (visual identity) and expanded-prompt.md (scene-level creative breakdown + Execution Manifest).
  Framepack is the director who knows which lights to turn on — not the electrician who wires the studio.
  v0.11.1 adds Asset Intake (Phase 0): asset detector (PNG/JPG/SVG transparency), six-category asset checklist, asset-intake.md manifest generation, degradation branches by video type. v0.11.0 adds: Kinetic Taste Engine (taste audit, surprise operators, kinetic grammar, taste specimens) plus HyperFrames 0.6.104 compatibility and environment doctor cwd fix.
  v0.10.6 adds: Production Hardening Patch (external font dependency audit, local font asset checks, low-visibility risk audit, finite-number guards, project-local proof path checks) on top of the Production Quality Layer.
  v0.10.5 adds: Production Quality Layer (timeline manifest, proof frames/contact sheets, scene specs, fail-on severity gates) plus Arsenal Binding Contract.
  v0.10.2 adds: Environment & Upgrade Manager (report-only doctor, safe skill install/overlay/upgrade managers, upgrade report).
  v0.10.1 adds: HyperFrames Compatibility Adapter (command classification, capability snapshots, registry fallback, official-skill diff reports, upstream watcher script).
  v0.10.0 adds: Arsenal Registry runtime (.framepack/arsenal.json creation, Execution Manifest reconciliation, builtin weapon catalog, trusted-source whitelist, HyperFrames preflight audit).
  v0.9.4 adds: Replica Mode render integrity (root data-duration guardrail, VIDEO_DNA/content decomposition/TEMPLATE_BLUEPRINT contract, ambiguity ban).
  v0.9.3 adds: test-team workflow hardening (clip-root animation ban with inner wrappers, text-split CSS contract fix, state.json future-only clarification).
  v0.9.2 adds: Guardrail Hydrator (plugin-owned guardrails.md, project AGENTS.md managed block, hash-based drift repair, current-session injection).
  v0.9.1 adds: HyperFrames Structure Bridge (time windows, structure checklist, resolveElement compat, AGENTS.md iron rule).
author: Framepack Team
license: MIT
homepage: https://github.com/ARTHUR-BBU/framepack
hooks:
  - pre_tool_call
  - post_tool_call
