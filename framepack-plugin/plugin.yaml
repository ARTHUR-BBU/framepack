name: framepack
version: "0.8.0"
description: >-
  Prompt Factory for HyperFrames. Translates fuzzy user intent into frame.md
  (visual identity) and expanded-prompt.md (scene-level creative breakdown).
  HyperFrames takes over from there. Framepack is the director who knows which
  lights to turn on — not the electrician who wires the studio.
author: Framepack Team
license: MIT
homepage: https://github.com/ARTHUR-BBU/framepack
hooks:
  - pre_tool_call
  - post_tool_call
