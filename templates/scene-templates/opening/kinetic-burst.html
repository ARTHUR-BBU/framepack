<!--
  Kinetic Burst Opening — 动感爆裂
  Uses: stagger + blur + scale for explosive energy
  Vars: {{entityName}}, {{entityTagline}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary, --accent-secondary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;">

  <!-- Burst rings -->
  <div class="burst-ring ring-1" style="position:absolute;width:60vmax;height:60vmax;border-radius:50%;border:2px solid var(--accent-primary);opacity:0;z-index:0;"></div>
  <div class="burst-ring ring-2" style="position:absolute;width:40vmax;height:40vmax;border-radius:50%;border:2px solid var(--accent-secondary);opacity:0;z-index:0;"></div>

  <!-- Title -->
  <h1 class="scene-title" style="font-size:clamp(64px,11vw,150px);font-weight:900;color:var(--accent-primary);text-transform:uppercase;letter-spacing:0.02em;z-index:2;line-height:0.9;text-align:center;text-shadow:0 0 40px rgba(0,0,0,0.5);">{{entityName}}</h1>

  <!-- Tagline -->
  <p class="scene-tagline" style="font-size:clamp(22px,3.5vw,42px);color:var(--text-primary);font-weight:700;text-transform:uppercase;letter-spacing:clamp(3px,0.6vw,10px);z-index:2;margin-top:clamp(6px,1vw,16px);">{{entityTagline}}</p>
</div>

<!--
  GSAP Timeline:
  tl.from("#scene-{{sceneIndex}} .scene-title", { scale: 3, opacity: 0, filter: "blur(20px)", duration: 0.5, ease: "expo.out" }, {{sceneStart}} + 0.2)
  tl.from("#scene-{{sceneIndex}} .scene-tagline", { y: 50, opacity: 0, duration: 0.4, ease: "back.out(1.4)" }, {{sceneStart}} + 0.6)
  tl.from("#scene-{{sceneIndex}} .ring-1", { scale: 0, opacity: 0.6, duration: 0.8, ease: "power2.out" }, {{sceneStart}} + 0.1)
  tl.from("#scene-{{sceneIndex}} .ring-2", { scale: 0, opacity: 0.4, duration: 0.6, ease: "power2.out" }, {{sceneStart}} + 0.3)
  tl.to("#scene-{{sceneIndex}} .ring-1", { scale: 2, opacity: 0, duration: 0.8 }, {{sceneStart}} + 0.5)
  tl.to("#scene-{{sceneIndex}} .ring-2", { scale: 2, opacity: 0, duration: 0.6 }, {{sceneStart}} + 0.7)
-->
