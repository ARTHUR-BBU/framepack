<!--
  Dark Build Opening — 暗场蓄力开场
  Uses: scale 0→1 + noise grain + text reveal
  Vars: {{entityName}}, {{entityTagline}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;">

  <!-- Noise grain overlay -->
  <div class="noise-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.08;z-index:1;pointer-events:none;background-image:url('data:image/svg+xml,%3Csvg viewBox=%220 0 256 256%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%224%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');"></div>

  <!-- Accent glow -->
  <div class="accent-glow" style="position:absolute;width:40vmax;height:40vmax;border-radius:50%;background:var(--accent-primary);opacity:0.12;filter:blur(80px);z-index:0;"></div>

  <!-- Main title -->
  <h1 class="scene-title" style="font-size:clamp(72px,12vw,160px);font-weight:900;color:var(--text-primary);text-transform:uppercase;letter-spacing:0.05em;z-index:2;line-height:0.9;text-align:center;">{{entityName}}</h1>

  <!-- Accent line -->
  <div class="accent-line" style="width:clamp(120px,20vw,300px);height:4px;background:var(--accent-primary);z-index:2;margin-top:clamp(12px,2vw,32px);"></div>

  <!-- Tagline -->
  <p class="scene-tagline" style="font-size:clamp(24px,4vw,48px);color:var(--text-primary);opacity:0.7;letter-spacing:clamp(4px,0.8vw,16px);text-transform:uppercase;z-index:2;margin-top:clamp(8px,1.5vw,24px);">{{entityTagline}}</p>
</div>

<!--
  GSAP Timeline (add to main timeline):
  tl.from("#scene-{{sceneIndex}} .scene-title", { scale: 0, duration: 0.8, ease: "back.out(1.7)" }, {{sceneStart}} + 0.3)
  tl.from("#scene-{{sceneIndex}} .accent-line", { scaleX: 0, duration: 0.4, ease: "power2.out" }, {{sceneStart}} + 0.8)
  tl.from("#scene-{{sceneIndex}} .scene-tagline", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, {{sceneStart}} + 1.0)
  tl.from("#scene-{{sceneIndex}} .accent-glow", { scale: 0, duration: 1.2, ease: "power2.out" }, {{sceneStart}} + 0.1)
-->
