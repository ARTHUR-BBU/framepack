<!--
  Impact Slam Opening — 重击式标题
  Uses: scale:5→1 + shake + text split
  Vars: {{entityName}}, {{entityTagline}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;">

  <!-- Main title (will be split into chars by GSAP SplitText or manual spans) -->
  <h1 class="scene-title" style="font-size:clamp(80px,14vw,180px);font-weight:900;color:var(--text-primary);text-transform:uppercase;letter-spacing:-0.02em;z-index:2;line-height:0.85;text-align:center;">{{entityName}}</h1>

  <!-- Subtitle -->
  <p class="scene-subtitle" style="font-size:clamp(20px,3.5vw,40px);color:var(--accent-primary);font-weight:700;text-transform:uppercase;letter-spacing:clamp(2px,0.5vw,8px);z-index:2;margin-top:clamp(8px,1.5vw,24px);">{{entityTagline}}</p>
</div>

<!--
  GSAP Timeline:
  tl.from("#scene-{{sceneIndex}} .scene-title", { scale: 5, opacity: 0, duration: 0.5, ease: "back.out(1.7)" }, {{sceneStart}} + 0.2)
  tl.to("#scene-{{sceneIndex}} .scene-title", { x: [-8, 8, -4, 4, 0], duration: 0.15 }, {{sceneStart}} + 0.65)
  tl.from("#scene-{{sceneIndex}} .scene-subtitle", { y: 60, opacity: 0, duration: 0.4, ease: "power3.out" }, {{sceneStart}} + 0.7)
-->
