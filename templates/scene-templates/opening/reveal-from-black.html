<!--
  Reveal from Black — 黑场渐现
  Uses: opacity 0→1 with stagger for elegance
  Vars: {{entityName}}, {{entityTagline}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:#000000;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;">

  <!-- Subtle background image (optional, replace with actual asset) -->
  <div class="bg-image" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.3;background-size:cover;background-position:center;z-index:0;"></div>

  <!-- Gradient overlay for text readability -->
  <div class="gradient-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(0,0,0,0.6) 0%,rgba(0,0,0,0.3) 50%,rgba(0,0,0,0.7) 100%);z-index:1;"></div>

  <!-- Title -->
  <h1 class="scene-title" style="font-size:clamp(48px,10vw,140px);font-weight:300;color:#ffffff;letter-spacing:clamp(2px,0.4vw,8px);z-index:2;text-align:center;">{{entityName}}</h1>

  <!-- Divider -->
  <div class="divider" style="width:clamp(60px,10vw,200px);height:1px;background:var(--accent-primary);z-index:2;margin:clamp(8px,1.5vw,24px) 0;"></div>

  <!-- Tagline -->
  <p class="scene-tagline" style="font-size:clamp(18px,3vw,36px);color:rgba(255,255,255,0.8);font-weight:300;letter-spacing:clamp(1px,0.3vw,6px);text-transform:uppercase;z-index:2;">{{entityTagline}}</p>
</div>

<!--
  GSAP Timeline:
  tl.from("#scene-{{sceneIndex}} .bg-image", { scale: 1.2, duration: 2, ease: "power1.out" }, {{sceneStart}})
  tl.from("#scene-{{sceneIndex}} .scene-title", { opacity: 0, y: 20, duration: 1, ease: "power2.out" }, {{sceneStart}} + 0.5)
  tl.from("#scene-{{sceneIndex}} .divider", { scaleX: 0, duration: 0.6, ease: "power2.out" }, {{sceneStart}} + 1.0)
  tl.from("#scene-{{sceneIndex}} .scene-tagline", { opacity: 0, y: 15, duration: 0.8, ease: "power2.out" }, {{sceneStart}} + 1.3)
-->
