<!--
  Bold Text CTA — 大字行动号召
  Uses: scale + fade for bold closing statement
  Vars: {{ctaHeadline}}, {{ctaSubtext}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;">

  <!-- Accent background glow -->
  <div class="cta-glow" style="position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:var(--accent-primary);opacity:0.08;filter:blur(80px);z-index:0;"></div>

  <!-- Headline -->
  <h1 class="cta-headline" style="font-size:clamp(40px,8vw,120px);font-weight:900;color:var(--text-primary);text-transform:uppercase;letter-spacing:0.02em;z-index:2;text-align:center;line-height:1;">{{ctaHeadline}}</h1>

  <!-- Subtext -->
  <p class="cta-subtext" style="font-size:clamp(16px,2.5vw,32px);color:var(--accent-primary);font-weight:600;z-index:2;margin-top:clamp(8px,1.5vw,24px);text-align:center;">{{ctaSubtext}}</p>
</div>

<!--
  GSAP Timeline:
  tl.from("#scene-{{sceneIndex}} .cta-headline", { scale: 0.5, opacity: 0, duration: 0.6, ease: "back.out(1.7)" }, {{sceneStart}} + 0.3)
  tl.from("#scene-{{sceneIndex}} .cta-subtext", { y: 30, opacity: 0, duration: 0.4, ease: "power3.out" }, {{sceneStart}} + 0.7)
  tl.from("#scene-{{sceneIndex}} .cta-glow", { scale: 0, duration: 1, ease: "power2.out" }, {{sceneStart}} + 0.2)
-->
