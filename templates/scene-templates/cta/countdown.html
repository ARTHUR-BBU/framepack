<!--
  Countdown CTA — 倒计时行动号召
  Uses: number decrement animation with urgency
  Vars: {{countdownFrom}}, {{ctaHeadline}}, {{ctaSubtext}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;">

  <!-- Countdown number -->
  <div class="countdown-number" style="font-size:clamp(100px,22vw,320px);font-weight:900;color:var(--accent-primary);z-index:2;line-height:1;">{{countdownFrom}}</div>

  <!-- Headline -->
  <h2 class="cta-headline" style="font-size:clamp(20px,3.5vw,48px);font-weight:800;color:var(--text-primary);z-index:2;text-align:center;margin-top:clamp(4px,1vw,16px);">{{ctaHeadline}}</h2>

  <!-- Subtext -->
  <p class="cta-subtext" style="font-size:clamp(12px,1.8vw,24px);color:var(--text-primary);opacity:0.6;z-index:2;margin-top:clamp(4px,0.8vw,12px);text-align:center;">{{ctaSubtext}}</p>
</div>

<!--
  GSAP Timeline:
  var countdownProxy = { val: {{countdownFrom}} };
  tl.to(countdownProxy, { val: 0, duration: 2, ease: "steps(1)", onUpdate: function() {
    document.querySelector("#scene-{{sceneIndex}} .countdown-number").textContent = Math.round(countdownProxy.val);
  }}, {{sceneStart}} + 0.5)
  tl.from("#scene-{{sceneIndex}} .countdown-number", { scale: 1.5, opacity: 0, duration: 0.3, ease: "power2.out" }, {{sceneStart}} + 0.3)
  tl.from("#scene-{{sceneIndex}} .cta-headline", { y: 30, opacity: 0, duration: 0.4, ease: "power3.out" }, {{sceneStart}} + 0.8)
  tl.from("#scene-{{sceneIndex}} .cta-subtext", { y: 20, opacity: 0, duration: 0.3, ease: "power3.out" }, {{sceneStart}} + 1.0)
-->
