  Hard Cut Transition — 硬切过渡
  Uses: tl.set for instant scene switch (HyperFrames recommended)
  This is NOT a scene element but a transition code pattern.
  Vars: {{prevSceneId}}, {{nextSceneId}}, {{cutTime}}

<!--
  GSAP Transition Code (add between scenes in timeline):
  tl.set("#{{prevSceneId}} .scene-content", { opacity: 0 }, {{cutTime}})
  tl.set("#{{nextSceneId}}", { opacity: 1 }, {{cutTime}})
-->
