<!--
  White Flash Transition — 白闪过渡
  Uses: white overlay with quick opacity pulse
  Vars: {{prevSceneId}}, {{nextSceneId}}, {{flashTime}}
  Note: Add a white overlay div to composition root for this to work
-->
<!--
  HTML (add to composition root, outside all scenes):
  <div class="flash-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;background:#ffffff;opacity:0;z-index:100;pointer-events:none;"></div>

  GSAP Transition Code:
  tl.to(".flash-overlay", { opacity: 0.9, duration: 0.1 }, {{flashTime}})
  tl.set("#{{prevSceneId}} .scene-content", { opacity: 0 }, {{flashTime}} + 0.1)
  tl.set("#{{nextSceneId}} .scene-content", { opacity: 1 }, {{flashTime}} + 0.1)
  tl.to(".flash-overlay", { opacity: 0, duration: 0.3 }, {{flashTime}} + 0.15)
-->
