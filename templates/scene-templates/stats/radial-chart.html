<!--
  Radial Chart — 环形图表
  Uses: strokeDasharray animation for ring chart
  Vars: {{chartValue}}, {{chartLabel}}, {{chartSubtext}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;">

  <!-- SVG Ring Chart -->
  <svg class="radial-svg" viewBox="0 0 200 200" style="width:clamp(120px,25vw,300px);height:clamp(120px,25vw,300px);z-index:2;">
    <!-- Background ring -->
    <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="12" />
    <!-- Animated ring -->
    <circle class="ring-progress" cx="100" cy="100" r="80" fill="none" stroke="var(--accent-primary)" stroke-width="12" stroke-linecap="round"
            style="stroke-dasharray:502;stroke-dashoffset:502;transform:rotate(-90deg);transform-origin:center;" />
    <!-- Center text -->
    <text x="100" y="90" text-anchor="middle" style="font-size:42px;font-weight:900;fill:var(--text-primary);">
      <tspan class="chart-value">{{chartValue}}</tspan>
    </text>
    <text x="100" y="120" text-anchor="middle" style="font-size:14px;font-weight:500;fill:var(--text-primary);opacity:0.7;">
      <tspan class="chart-label">{{chartLabel}}</tspan>
    </text>
  </svg>

  <!-- Subtext -->
  <p class="chart-subtext" style="font-size:clamp(14px,2vw,24px);color:var(--text-primary);opacity:0.6;z-index:2;margin-top:clamp(8px,1.5vw,24px);text-align:center;">{{chartSubtext}}</p>
</div>

<!--
  GSAP Timeline:
  // Animate the ring: strokeDashoffset from 502 (empty) to target value
  // Target offset = 502 - (502 * percentage / 100)
  tl.to("#scene-{{sceneIndex}} .ring-progress", { strokeDashoffset: 126, duration: 1.5, ease: "power2.out" }, {{sceneStart}} + 0.5)
  tl.from("#scene-{{sceneIndex}} .radial-svg", { scale: 0, duration: 0.6, ease: "back.out(1.4)" }, {{sceneStart}} + 0.3)
  tl.from("#scene-{{sceneIndex}} .chart-subtext", { y: 20, opacity: 0, duration: 0.4, ease: "power3.out" }, {{sceneStart}} + 1.5)
-->
