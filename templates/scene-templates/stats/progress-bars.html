<!--
  Progress Bars — 进度条动画
  Uses: width:0→N% with stagger for data comparison
  Vars: {{bar1Label}}, {{bar1Value}}, {{bar2Label}}, {{bar2Value}}, {{bar3Label}}, {{bar3Value}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary, --accent-secondary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:clamp(12px,2vw,32px);position:relative;overflow:hidden;padding:clamp(20px,4vw,60px);">

  <!-- Bar 1 -->
  <div class="bar-group" style="width:80%;z-index:2;">
    <div style="display:flex;justify-content:space-between;margin-bottom:clamp(4px,0.5vw,8px);">
      <span class="bar-label" style="font-size:clamp(14px,2vw,24px);color:var(--text-primary);font-weight:600;">{{bar1Label}}</span>
      <span class="bar-value" style="font-size:clamp(14px,2vw,24px);color:var(--accent-primary);font-weight:700;">{{bar1Value}}</span>
    </div>
    <div style="width:100%;height:clamp(8px,1.2vw,16px);background:rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;">
      <div class="bar-fill bar-1" style="width:0%;height:100%;background:var(--accent-primary);border-radius:8px;"></div>
    </div>
  </div>

  <!-- Bar 2 -->
  <div class="bar-group" style="width:80%;z-index:2;">
    <div style="display:flex;justify-content:space-between;margin-bottom:clamp(4px,0.5vw,8px);">
      <span class="bar-label" style="font-size:clamp(14px,2vw,24px);color:var(--text-primary);font-weight:600;">{{bar2Label}}</span>
      <span class="bar-value" style="font-size:clamp(14px,2vw,24px);color:var(--accent-secondary);font-weight:700;">{{bar2Value}}</span>
    </div>
    <div style="width:100%;height:clamp(8px,1.2vw,16px);background:rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;">
      <div class="bar-fill bar-2" style="width:0%;height:100%;background:var(--accent-secondary);border-radius:8px;"></div>
    </div>
  </div>

  <!-- Bar 3 -->
  <div class="bar-group" style="width:80%;z-index:2;">
    <div style="display:flex;justify-content:space-between;margin-bottom:clamp(4px,0.5vw,8px);">
      <span class="bar-label" style="font-size:clamp(14px,2vw,24px);color:var(--text-primary);font-weight:600;">{{bar3Label}}</span>
      <span class="bar-value" style="font-size:clamp(14px,2vw,24px);color:var(--accent-primary);font-weight:700;">{{bar3Value}}</span>
    </div>
    <div style="width:100%;height:clamp(8px,1.2vw,16px);background:rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;">
      <div class="bar-fill bar-3" style="width:0%;height:100%;background:var(--accent-primary);border-radius:8px;"></div>
    </div>
  </div>
</div>

<!--
  GSAP Timeline:
  tl.from("#scene-{{sceneIndex}} .bar-group", { y: 30, opacity: 0, stagger: 0.15, duration: 0.4, ease: "power3.out" }, {{sceneStart}} + 0.3)
  tl.to("#scene-{{sceneIndex}} .bar-1", { width: "85%", duration: 1, ease: "power2.out" }, {{sceneStart}} + 0.6)
  tl.to("#scene-{{sceneIndex}} .bar-2", { width: "70%", duration: 1, ease: "power2.out" }, {{sceneStart}} + 0.8)
  tl.to("#scene-{{sceneIndex}} .bar-3", { width: "92%", duration: 1, ease: "power2.out" }, {{sceneStart}} + 1.0)
-->
