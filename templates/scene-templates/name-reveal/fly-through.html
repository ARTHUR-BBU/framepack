<!--
  Fly Through Name Reveal — 飞越透视名称揭露
  Uses: scale:8→1 + blur transition for dramatic zoom effect
  Vars: {{entityName}}, {{entitySubtitle}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;">

  <!-- Background image (optional portrait/hero shot) -->
  <div class="bg-portrait" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.25;background-size:cover;background-position:center top;z-index:0;"></div>

  <!-- Gradient overlay -->
  <div class="gradient" style="position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(0,0,0,0.8) 0%,rgba(0,0,0,0.2) 40%,rgba(0,0,0,0.8) 100%);z-index:1;"></div>

  <!-- Name -->
  <h1 class="scene-title" style="font-size:clamp(60px,14vw,200px);font-weight:900;color:var(--accent-primary);text-transform:uppercase;letter-spacing:-0.02em;z-index:2;line-height:0.85;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,0.5);">{{entityName}}</h1>

  <!-- Subtitle/role -->
  <p class="scene-subtitle" style="font-size:clamp(16px,2.5vw,32px);color:var(--text-primary);opacity:0.8;font-weight:600;letter-spacing:clamp(2px,0.5vw,8px);text-transform:uppercase;z-index:2;margin-top:clamp(4px,1vw,16px);">{{entitySubtitle}}</p>
</div>

<!--
  GSAP Timeline:
  tl.from("#scene-{{sceneIndex}} .scene-title", { scale: 8, opacity: 0, filter: "blur(30px)", duration: 0.7, ease: "expo.out" }, {{sceneStart}} + 0.3)
  tl.from("#scene-{{sceneIndex}} .scene-subtitle", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, {{sceneStart}} + 0.9)
  tl.from("#scene-{{sceneIndex}} .bg-portrait", { scale: 1.3, duration: 2, ease: "power1.out" }, {{sceneStart}})
-->
