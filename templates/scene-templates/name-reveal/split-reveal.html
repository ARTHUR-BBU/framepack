<!--
  Split Reveal — 分屏揭露
  Uses: clipPath animation for left/right reveal
  Vars: {{entityName}}, {{entitySubtitle}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">

  <!-- Left panel -->
  <div class="panel-left" style="position:absolute;top:0;left:0;width:50%;height:100%;background:var(--accent-primary);z-index:1;"></div>

  <!-- Right panel -->
  <div class="panel-right" style="position:absolute;top:0;right:0;width:50%;height:100%;background:var(--accent-primary);z-index:1;"></div>

  <!-- Content (revealed between panels) -->
  <div class="reveal-content" style="z-index:2;text-align:center;">
    <h1 class="scene-title" style="font-size:clamp(56px,12vw,180px);font-weight:900;color:var(--text-primary);text-transform:uppercase;letter-spacing:0.02em;line-height:0.9;">{{entityName}}</h1>
    <p class="scene-subtitle" style="font-size:clamp(18px,3vw,36px);color:var(--accent-primary);font-weight:600;letter-spacing:clamp(2px,0.5vw,8px);text-transform:uppercase;margin-top:clamp(4px,1vw,16px);">{{entitySubtitle}}</p>
  </div>
</div>

<!--
  GSAP Timeline:
  tl.from("#scene-{{sceneIndex}} .reveal-content", { opacity: 0, duration: 0.01 }, {{sceneStart}})
  tl.to("#scene-{{sceneIndex}} .panel-left", { xPercent: -100, duration: 0.6, ease: "power3.inOut" }, {{sceneStart}} + 0.3)
  tl.to("#scene-{{sceneIndex}} .panel-right", { xPercent: 100, duration: 0.6, ease: "power3.inOut" }, {{sceneStart}} + 0.3)
  tl.from("#scene-{{sceneIndex}} .scene-title", { scale: 1.2, opacity: 0, duration: 0.5, ease: "power2.out" }, {{sceneStart}} + 0.7)
  tl.from("#scene-{{sceneIndex}} .scene-subtitle", { y: 30, opacity: 0, duration: 0.4, ease: "power3.out" }, {{sceneStart}} + 1.0)
-->
