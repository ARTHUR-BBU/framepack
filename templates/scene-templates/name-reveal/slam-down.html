<!--
  Slam Down Name Reveal — 重力砸入名称揭露
  Uses: y:-100% with bounce for heavy impact feel
  Vars: {{entityName}}, {{entitySubtitle}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);display:flex;align-items:flex-end;justify-content:center;flex-direction:column;position:relative;overflow:hidden;padding:clamp(20px,4vw,60px);">

  <!-- Accent bar top -->
  <div class="accent-bar" style="position:absolute;top:0;left:0;width:100%;height:4px;background:var(--accent-primary);z-index:2;"></div>

  <!-- Name -->
  <h1 class="scene-title" style="font-size:clamp(56px,12vw,180px);font-weight:900;color:var(--text-primary);text-transform:uppercase;letter-spacing:-0.03em;z-index:2;line-height:0.9;text-align:right;">{{entityName}}</h1>

  <!-- Subtitle -->
  <p class="scene-subtitle" style="font-size:clamp(18px,3vw,36px);color:var(--accent-primary);font-weight:700;text-transform:uppercase;letter-spacing:clamp(2px,0.4vw,8px);z-index:2;margin-top:clamp(4px,1vw,12px);text-align:right;">{{entitySubtitle}}</p>
</div>

<!--
  GSAP Timeline:
  tl.from("#scene-{{sceneIndex}} .scene-title", { y: "-120%", duration: 0.6, ease: "bounce.out" }, {{sceneStart}} + 0.3)
  tl.from("#scene-{{sceneIndex}} .scene-subtitle", { y: -60, opacity: 0, duration: 0.4, ease: "power3.out" }, {{sceneStart}} + 0.8)
  tl.from("#scene-{{sceneIndex}} .accent-bar", { scaleX: 0, duration: 0.3, ease: "power2.out" }, {{sceneStart}} + 0.5)
-->
