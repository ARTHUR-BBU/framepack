<!--
  Fullscreen Labels — 全屏视频 + 浮动标签
  Uses: video background with floating text labels
  Vars: {{videoSrc}}, {{labelText}}, {{subLabelText}}, {{sceneStart}}, {{sceneDuration}}
  Tokens: --bg-primary, --accent-primary, --text-primary
  Video integration: video inside scene, GSAP controls opacity
-->
<div id="scene-{{sceneIndex}}" class="scene clip" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" style="background:var(--bg-primary);position:relative;overflow:hidden;">

  <!-- Video background -->
  <video id="bg-video-{{sceneIndex}}" data-start="{{sceneStart}}" data-duration="{{sceneDuration}}" data-media-start="0"
         muted playsinline src="{{videoSrc}}"
         style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;"></video>

  <!-- Dark overlay for text readability -->
  <div class="video-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.1) 40%,rgba(0,0,0,0.5) 100%);z-index:1;"></div>

  <!-- Floating label -->
  <div class="floating-label" style="position:absolute;bottom:12%;left:8%;z-index:2;">
    <div class="label-badge" style="display:inline-block;padding:clamp(4px,0.8vw,12px) clamp(10px,2vw,24px);background:var(--accent-primary);border-radius:4px;margin-bottom:clamp(4px,0.8vw,12px);">
      <span style="font-size:clamp(12px,1.5vw,18px);font-weight:700;color:#000;text-transform:uppercase;letter-spacing:1px;">{{labelText}}</span>
    </div>
    <p class="sub-label" style="font-size:clamp(18px,3vw,40px);font-weight:700;color:var(--text-primary);text-shadow:0 2px 10px rgba(0,0,0,0.5);">{{subLabelText}}</p>
  </div>
</div>

<!--
  GSAP Timeline:
  gsap.set("#bg-video-{{sceneIndex}}", { opacity: 0 })
  tl.to("#bg-video-{{sceneIndex}}", { opacity: 1, duration: 0.5 }, {{sceneStart}} + 0.2)
  tl.from("#scene-{{sceneIndex}} .floating-label", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, {{sceneStart}} + 0.8)
  tl.from("#scene-{{sceneIndex}} .label-badge", { scale: 0, duration: 0.3, ease: "back.out(1.7)" }, {{sceneStart}} + 0.6)
-->
