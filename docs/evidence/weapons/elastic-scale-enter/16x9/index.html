<style>@font-face{font-family:'Noto Sans SC Variable';src:url('./fonts/files/noto-sans-sc-4-wght-normal.woff2') format('woff2-variations');font-weight:100 900;unicode-range:U+1F300}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#f5f0e8;font-family:"Noto Sans SC Variable",sans-serif}#root{position:relative;width:1920px;height:1080px;overflow:hidden}.clip{position:absolute;inset:0}.scene-inner{position:absolute;inset:0;display:grid;place-items:center;padding:120px;background:radial-gradient(circle at 70% 22%,rgba(227,76,45,.22),transparent 34%),linear-gradient(135deg,#10131b,#07080c)}.scene-inner:before{content:"";position:absolute;inset:5%;border:1px solid rgba(245,240,232,.13)}.kicker{position:absolute;top:7%;left:7%;font-size:24px;letter-spacing:.18em;color:#e34c2d}.demo{position:relative;width:100%;display:grid;place-items:center;text-align:center}.split{position:relative;font-size:132px;font-weight:900;letter-spacing:-.05em;line-height:.95}.split-left,.split-right{display:block}.split-left{clip-path:inset(0 50% 0 0)}.split-right{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}.caption{display:flex;flex-wrap:wrap;justify-content:center;gap:.22em;max-width:1250px;font-size:92px;font-weight:800;line-height:1.15}.word{display:inline-block}.metric{font-size:250px;font-weight:900;letter-spacing:-.07em;color:#ff6847}.focus{padding:.45em .7em;border-radius:.25em;background:#f5f0e8;color:#11131a;font-size:120px;font-weight:900}.gradient{width:1250px;height:560px;border-radius:48px;display:grid;place-items:center;font-size:86px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:1200px}.grid>span{display:grid;place-items:center;min-height:150px;border:1px solid rgba(245,240,232,.24);background:rgba(245,240,232,.08);font-size:30px;font-weight:700}.proof{margin-top:32px;font-size:30px;color:rgba(245,240,232,.65)}</style></head>
